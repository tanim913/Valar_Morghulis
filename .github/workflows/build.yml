name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest runner image: the build then runs on 22.04 and newer
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install freeglut (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y freeglut3-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist/all-men-must-die
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../all-men-must-die-windows.zip all-men-must-die
          else
            tar czf ../all-men-must-die-linux.tar.gz all-men-must-die
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: all-men-must-die-${{ matrix.name }}
          path: all-men-must-die-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
