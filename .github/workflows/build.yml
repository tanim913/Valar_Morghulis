name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            container: ubuntu:20.04 # built on the oldest supported Ubuntu, so it runs on 20.04 and newer
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install the build tools (Linux, inside the Ubuntu 20.04 container)
        if: matrix.name == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive # tzdata would otherwise stop and ask for a time zone
          TZ: Etc/UTC
        run: apt-get update && apt-get install -y build-essential cmake git freeglut3-dev dpkg-dev

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Test
        # (not --test-dir: Ubuntu 20.04's CMake is older than that)
        run: cd build && ctest -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          VERSION=1.0.0
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}";; esac
          cmake --install build --config Release --prefix dist/all-men-must-die
          if [ "${{ matrix.name }}" = "windows" ]; then
            (cd dist && 7z a ../all-men-must-die-windows.zip all-men-must-die)
          else
            packaging/linux/make_deb.sh dist/all-men-must-die all-men-must-die-linux-amd64.deb "$VERSION"
          fi

      # The setup program is a bonus on top of the zip: if it fails, the zip is still published.
      - name: Windows setup program
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          command -v makensis || { choco install nsis -y --no-progress; export PATH="$PATH:/c/Program Files (x86)/NSIS"; }
          if ! cpack --config build/CPackConfig.cmake -G NSIS -C Release -B installer > cpack.log 2>&1; then
            # job logs are private, so put the reason where it can be read: an error annotation
            echo "::error title=cpack NSIS failed::$(tail -n 25 cpack.log | tr -d '\r' | sed -z 's/%/%25/g; s/\n/%0A/g')"
            exit 1
          fi
          mv installer/all-men-must-die-windows-setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: all-men-must-die-${{ matrix.name }}
          path: all-men-must-die-${{ matrix.name }}*

  # Installs the finished .deb on real Ubuntu systems, the way a person would, and starts the game.
  test-deb:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:latest"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: all-men-must-die-linux
          path: pkg

      - name: Install the package with apt, like the README says
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./pkg/all-men-must-die-linux-amd64.deb xvfb xauth libgl1-mesa-dri

      - name: Every library it needs is found, and the menu entry is installed
        run: |
          ! ldd /opt/all-men-must-die/all-men-must-die | grep "not found"
          test -f /usr/share/applications/all-men-must-die.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/all-men-must-die.png
          test -x /usr/bin/all-men-must-die

      - name: The game starts and keeps running (on a virtual screen)
        shell: bash
        run: |
          set +e
          timeout 10 xvfb-run -a all-men-must-die > run.log 2>&1
          code=$?
          cat run.log
          # 124 means it was still running when the timeout stopped it
          [ $code -eq 124 ] && ! grep -q "Cannot load" run.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
