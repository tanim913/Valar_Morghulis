name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest runner image: the build then runs on 22.04 and newer
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install freeglut (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y freeglut3-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          VERSION=1.0.0
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}";; esac
          cmake --install build --config Release --prefix dist/all-men-must-die
          if [ "${{ matrix.name }}" = "windows" ]; then
            (cd dist && 7z a ../all-men-must-die-windows.zip all-men-must-die)
          else
            packaging/linux/make_deb.sh dist/all-men-must-die all-men-must-die-linux-amd64.deb "$VERSION"
          fi

      # The setup program is a bonus on top of the zip: if it fails, the zip is still published.
      - name: Windows setup program
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          command -v makensis || { choco install nsis -y --no-progress; export PATH="$PATH:/c/Program Files (x86)/NSIS"; }
          cpack --config build/CPackConfig.cmake -G NSIS -C Release -B installer
          mv installer/all-men-must-die-windows-setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: all-men-must-die-${{ matrix.name }}
          path: all-men-must-die-${{ matrix.name }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
