<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">All Men Must Die</title>
  <desc id="d">A glowing dragon egg inside a golden ring above a fire, next to the title All Men Must Die, a dragon-egg arcade game in C++ and OpenGL for Windows and Linux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0809"/>
      <stop offset="1" stop-color="#1a110d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.17" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#e8742a" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#b8431a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b8431a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset="0.55" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#9a6422"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="0.6" stop-color="#f1cf86"/>
      <stop offset="1" stop-color="#d98a3a"/>
    </linearGradient>
    <radialGradient id="egg" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#6b2a1f"/>
      <stop offset="0.45" stop-color="#2a1210"/>
      <stop offset="1" stop-color="#0d0606"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a1f"/>
      <stop offset="0.6" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="scales" width="22" height="16" patternUnits="userSpaceOnUse" patternTransform="translate(0 2)">
      <path d="M0 16 A11 11 0 0 1 22 16" fill="none" stroke="#ff9a4a" stroke-opacity="0.34" stroke-width="1.4"/>
      <path d="M-11 8 A11 11 0 0 1 11 8 M11 8 A11 11 0 0 1 33 8" fill="none" stroke="#ff9a4a" stroke-opacity="0.34" stroke-width="1.4"/>
    </pattern>
    <clipPath id="eggClip"><path id="eggShape" d="M200 96 C240 96 266 152 266 198 C266 240 238 264 200 264 C162 264 134 240 134 198 C134 152 160 96 200 96 Z"/></clipPath>
    <clipPath id="ringClip"><circle cx="200" cy="170" r="104"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

